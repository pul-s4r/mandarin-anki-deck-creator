[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anki-pipeline-core"
version = "0.1.0"
description = "Shared models, state, normalisation, and LLM client for Mandarin vocab tooling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "langchain-aws>=1.4",
    "langchain-core>=0.3",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/anki_pipeline_core"]
